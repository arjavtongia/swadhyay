  <script>
    /* A soft temple bell as the darshan opens, made in code so it needs no file and works offline.
       Browsers only allow sound before a tap where the app is installed or often used. Anywhere
       else (a browser tab, an iPhone) the bell waits for the first touch instead, as one rings the
       ghanta on entering. Settings can turn it off (saved as "bell" with the other settings), and
       turning it on there rings it once. */
    var BELL = (function () {
      var AC = window.AudioContext || window.webkitAudioContext;
      /* Partials of a small brass ghanta: [ratio to the note, level, seconds to fade]. */
      var PARTIALS = [[0.5, 0.28, 3.2], [1, 1, 2.8], [1.004, 0.45, 2.8], [1.25, 0.3, 1.8], [1.5, 0.24, 1.5], [2, 0.26, 1.1], [2.76, 0.08, 0.7], [3, 0.06, 0.5]];

      function strike(ctx, delay) {
        var F = 587.33, at = ctx.currentTime + delay;
        var level = ctx.createGain(), soft = ctx.createBiquadFilter();
        level.gain.value = 0.2;
        soft.type = 'lowpass';
        soft.frequency.value = 4200;
        level.connect(soft);
        soft.connect(ctx.destination);
        PARTIALS.forEach(function (p) {
          var tone = ctx.createOscillator(), env = ctx.createGain();
          tone.frequency.value = F * p[0];
          env.gain.setValueAtTime(0.0001, at);
          env.gain.exponentialRampToValueAtTime(p[1], at + 0.008);
          env.gain.exponentialRampToValueAtTime(0.0001, at + p[2]);
          tone.connect(env);
          env.connect(level);
          tone.start(at);
          tone.stop(at + p[2] + 0.05);
        });
        setTimeout(function () { ctx.close(); }, (delay + 3.5) * 1000);
      }

      /* Rings if the browser allows sound now, and says whether it did. Inside a tap, resume()
         is allowed; anywhere else it never settles, so it is given up after a moment. */
      function play(delay, done) {
        var ctx;
        try { ctx = new AC(); } catch (e) { done(false); return; }
        if (ctx.state === 'running') { strike(ctx, delay); done(true); return; }
        var settled = false;
        function settle(ok) {
          if (settled) return;
          settled = true;
          if (ok && ctx.state === 'running') strike(ctx, delay); else ctx.close();
          done(ok && ctx.state === 'running');
        }
        ctx.resume().then(function () { settle(true); }, function () { settle(false); });
        setTimeout(function () { settle(false); }, 400);
      }

      /* Held back at the opening: ring at the first touch or key within 20 seconds, once. A touch
         that only scrolls does not count as a tap for the browser, so the bell waits for the next. */
      var EVENTS = ['touchend', 'click', 'keydown'], until = 0, trying = false;
      function onFirstTouch() {
        if (trying) return;
        if (Date.now() > until || !wanted()) { disarm(); return; }
        trying = true;
        play(0, function (rang) { trying = false; if (rang) disarm(); });
      }
      function arm() {
        until = Date.now() + 20000;
        EVENTS.forEach(function (e) { window.addEventListener(e, onFirstTouch, true); });
      }
      function disarm() {
        EVENTS.forEach(function (e) { window.removeEventListener(e, onFirstTouch, true); });
      }

      function wanted() {
        try {
          var saved = JSON.parse(localStorage.getItem('swadhyay.v1') || localStorage.getItem('jinvani.v1') || '{}');
          return saved.bell !== false;
        } catch (e) { return true; }
      }

      /* Opened out of sight (a background tab), it waits for the first touch rather than ringing unseen. */
      if (AC && wanted()) {
        if (document.visibilityState === 'hidden') arm();
        else play(0.25, function (rang) { if (!rang) arm(); });
      }
      /* For Settings: rings now (it is called from a tap) and drops any wait for a first touch. */
      return { ring: function (delay) { if (!AC) return; disarm(); play(delay || 0, function () {}); } };
    })();
  </script>

  <!-- Brass for the ornaments in js/ornaments.js; the stops follow the day and night colours in css/app.css. -->

      <linearGradient id="brassSide" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--brass-mid)"/><stop offset="1" style="stop-color:var(--brass-lo)"/></linearGradient>
    </defs>
  </svg>
